services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: docucast_user
      POSTGRES_PASSWORD: docucast_password
      POSTGRES_DB: docucast_db
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm /tmp/realm.json
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/docucast_db
      KC_DB_USERNAME: docucast_user
      KC_DB_PASSWORD: docucast_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realm.json:/tmp/realm.json:ro
    depends_on:
      - postgres

  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=us-east-1

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - keycloak
      - localstack
    environment:
      SPRING_PROFILES_ACTIVE: default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api-gateway